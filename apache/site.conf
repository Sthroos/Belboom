ServerTokens Prod
ServerSignature Off
TraceEnable Off
Listen 8080

# Only the reverse proxy may set the client IP; otherwise the per-IP login limit is bypassable.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy ${TRUSTED_PROXY}

# %U logs the path WITHOUT query string, so invite tokens never end up in the access log.
LogFormat "%a %t \"%m %U %H\" %>s %b %D" noquery
CustomLog /proc/self/fd/1 noquery
ErrorLog /proc/self/fd/2

<VirtualHost *:8080>
    DocumentRoot /var/www/app/public

    <Directory />
        Require all denied
        AllowOverride None
        Options None
    </Directory>
    <Directory /var/www/app/public>
        Require all granted
        AllowOverride None
        Options None
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'"
    Header always set X-Content-Type-Options "nosniff"
    # same-origin: with no-referrer, browsers send "Origin: null" on POST, which fails the CSRF origin check.
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set X-Robots-Tag "noindex, nofollow"
    Header always unset X-Powered-By
</VirtualHost>
